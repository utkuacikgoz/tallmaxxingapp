name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (engine, reference, content, mobile)
        run: pnpm -r --if-present typecheck
      - name: Unit tests (engine, content)
        run: |
          pnpm --filter @tallsoon/engine test
          pnpm --filter @tallsoon/content test
      - name: Testimonials consent gate
        run: node apps/mobile/scripts/check-testimonials.js
      - name: Web bundle smoke test (Metro resolves every route)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
