name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (engine, reference, content, mobile)
        run: pnpm -r --if-present typecheck
      - name: Unit tests (engine, content)
        run: |
          pnpm --filter @tallsoon/engine test
          pnpm --filter @tallsoon/content test
      - name: Testimonials consent gate
        run: node apps/mobile/scripts/check-testimonials.js
      - name: Web bundle smoke test (Metro resolves every route)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
      - name: Install QA browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Light and dark onboarding walkthroughs
        run: |
          node scripts/qa/serve.js apps/mobile/dist-ci 8099 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID"' EXIT
          node scripts/qa/flow.js light
          node scripts/qa/flow.js dark
      - name: QA screenshots and console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-qa
          path: artifacts/qa/
          if-no-files-found: ignore
