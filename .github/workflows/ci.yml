name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (engine, reference, content, mobile)
        run: pnpm -r --if-present typecheck
      - name: Unit tests (engine, content)
        run: |
          pnpm --filter @tallsoon/engine test
          pnpm --filter @tallsoon/content test
      - name: Mobile Jest regression tests
        run: pnpm --filter @tallsoon/mobile test --runInBand --watchman=false
      - name: Release configuration guards
        run: node scripts/check-release-config.js
      - name: TestFlight release safety checks
        run: |
          node --test scripts/ci/testflight.test.mjs
      - name: Testimonials consent gate
        run: node apps/mobile/scripts/check-testimonials.js
      - name: Web bundle smoke test (Metro resolves every route)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir dist-ci
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
      - name: Static companion website
        run: pnpm --filter @tallsoon/web build
      - name: Install QA browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Website calculator and route checks
        run: pnpm --filter @tallsoon/web test:e2e
      - name: Light and dark onboarding walkthroughs
        run: |
          node scripts/qa/serve.js apps/mobile/dist-ci 8099 &
          QA_SERVER_PID=$!
          trap 'kill "$QA_SERVER_PID"' EXIT
          node scripts/qa/flow.js light
          node scripts/qa/flow.js dark
      - name: QA screenshots and console output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-qa
          path: artifacts/qa/
          if-no-files-found: ignore

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile
      - name: Check signing profile guards and load the Fastlane lane
        working-directory: apps/mobile
        run: |
          bundle exec ruby ../../scripts/ci/signing_test.rb
          bundle exec fastlane lanes
