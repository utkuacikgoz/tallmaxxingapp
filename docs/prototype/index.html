<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<title>KinHeight · clickable prototype</title>
<style>
/* ===== Tokens: iOS system colors (light / dark), single app tint (teal), apricot used sparingly ===== */
:root{
  color-scheme:light dark;
  --bg:#F2F2F7; --card:#FFFFFF; --cardElev:#FFFFFF; --sheetBg:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);
  --fill:rgba(120,120,128,.2); --fill2:rgba(120,120,128,.16); --fill3:rgba(118,118,128,.12);
  --tint:#2F7D6D; --tintFill:rgba(47,125,109,.14); --onTint:#FFFFFF;
  --accent:#F2A65A; --accentText:#B05F12;
  --red:#FF3B30; --orange:#C25E00; --gray:#8E8E93;
  --nav:rgba(242,242,247,.82); --bar:rgba(249,249,249,.86); --banner:rgba(250,250,250,.9); --alert:rgba(242,242,242,.92);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",system-ui,Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:54px; --sab:34px; --m:16px;
  --r-list:12px; --r-btn:14px; --r-sheet:16px;
  --push:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --card:#1C1C1E; --cardElev:#2C2C2E; --sheetBg:#1C1C1E;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.36); --fill2:rgba(120,120,128,.32); --fill3:rgba(118,118,128,.24);
  --tint:#5FB8A5; --tintFill:rgba(95,184,165,.2); --onTint:#03231C;
  --accent:#F4B677; --accentText:#F4B677;
  --red:#FF453A; --orange:#FF9F0A; --gray:#8E8E93;
  --nav:rgba(10,10,10,.8); --bar:rgba(22,22,22,.86); --banner:rgba(40,40,40,.9); --alert:rgba(37,37,37,.94);
}}
/* Dynamic Type: on iOS Safari, -apple-system-body makes rem follow the user's text size. Other browsers use 17px. */
html{font-size:17px;font:-apple-system-body;font-family:var(--font)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--label);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(1000px 640px at 20% 10%,rgba(47,125,109,.14),transparent 60%),#E5E5EA}
@media (prefers-color-scheme:dark){body{background:radial-gradient(1000px 640px at 20% 10%,rgba(95,184,165,.12),transparent 60%),#0B0B0C}}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
/* Type scale (iOS default "Large" size) */
.largeTitle{font-size:2rem;line-height:1.206;font-weight:700;letter-spacing:.011em}
.title1{font-size:1.647rem;line-height:1.214;font-weight:700;letter-spacing:.013em}
.title2{font-size:1.294rem;line-height:1.273;font-weight:700;letter-spacing:-.005em}
.title3{font-size:1.176rem;line-height:1.25;font-weight:600;letter-spacing:-.022em}
.headline{font-size:1rem;line-height:1.294;font-weight:600;letter-spacing:-.024em}
.body{font-size:1rem;line-height:1.294;letter-spacing:-.024em}
.callout{font-size:.941rem;line-height:1.3125;letter-spacing:-.019em}
.subhead{font-size:.882rem;line-height:1.333;letter-spacing:-.014em}
.footnote{font-size:.765rem;line-height:1.385;letter-spacing:-.005em}
.caption{font-size:.706rem;line-height:1.333}
.l2{color:var(--label2)} .l3{color:var(--label3)} .tint{color:var(--tint)}
h1,h2,h3,p{margin:0}
/* ===== Device frame (desktop only) ===== */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.stage-label{font-size:12.5px;color:var(--label2);display:flex;gap:8px;align-items:center}
.stage-label b{color:var(--label)}
.device{width:390px;height:844px;border-radius:56px;background:#0A0A0A;padding:11px;box-sizing:content-box;box-shadow:0 0 0 2px #3A3A3C,0 40px 90px rgba(0,0,0,.3);transform-origin:center;position:relative;flex:none}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;background:#000;border-radius:20px;z-index:300}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 32px 0 40px;font-weight:600;font-size:17px;z-index:290;pointer-events:none;color:var(--label)}
.statusbar.light{color:#fff}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:var(--label);z-index:290;pointer-events:none}
#host{position:absolute;inset:0;overflow:hidden}
/* ===== Screens & transitions (iOS push / modal) ===== */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.push-in{animation:pushIn .5s var(--push) both}
.push-out{animation:pushOut .5s var(--push) both;pointer-events:none}
.pop-in{animation:popIn .5s var(--push) both}
.pop-out{animation:popOut .5s var(--push) both;pointer-events:none;z-index:2}
.modal-in{animation:modalIn .55s var(--push) both;z-index:3}
.modal-out{animation:modalOut .45s var(--push) both;pointer-events:none;z-index:3}
.fade-in{animation:fadeIn .35s ease both}
.stay{animation:stay .5s both;pointer-events:none}
@keyframes pushIn{from{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.08)}to{transform:none}}
@keyframes pushOut{to{transform:translateX(-30%);filter:brightness(.92)}}
@keyframes popIn{from{transform:translateX(-30%);filter:brightness(.92)}to{transform:none}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes modalIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes modalOut{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes stay{to{opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
/* ===== Navigation bar with large title ===== */
.nav{position:absolute;top:0;left:0;right:0;z-index:20;padding-top:var(--sat);transition:background .2s,box-shadow .2s}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:relative}
.nav-title{position:absolute;left:90px;right:90px;text-align:center;font-weight:600;font-size:1rem;letter-spacing:-.024em;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.nav.scrolled,.nav.solid{background:var(--nav);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav.scrolled .nav-title,.nav.solid .nav-title{opacity:1}
.nav-btn{min-width:44px;height:44px;display:flex;align-items:center;gap:3px;padding:0 8px;color:var(--tint);font-size:1rem;letter-spacing:-.024em;border-radius:10px}
.nav-btn:active{opacity:.35}
.nav-btn.bold{font-weight:600}
.nav-btn[disabled]{color:var(--label3);pointer-events:none}
.nav-btn svg{flex:none}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.progress span{display:block;height:100%;background:var(--tint);border-radius:0 2px 2px 0;transition:width .45s var(--push)}
.content{padding:calc(var(--sat) + 44px) 0 calc(var(--sab) + 24px)}
.lt-wrap{padding:2px var(--m) 8px}
.sec{margin:0 var(--m)}
/* ===== Buttons (HIG: filled / tinted / bordered / plain) ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;padding:14px 20px;border-radius:var(--r-btn);font-size:1rem;font-weight:600;letter-spacing:-.024em;transition:opacity .15s,transform .15s;user-select:none}
.btn:active{opacity:.7}
.btn-filled{background:var(--tint);color:var(--onTint)}
.btn-tinted{background:var(--tintFill);color:var(--tint)}
.btn-bordered{background:var(--fill3);color:var(--tint)}
.btn-plain{color:var(--tint);min-height:44px;padding:10px;font-weight:400}
.btn-small{min-height:34px;width:auto;padding:7px 14px;font-size:.882rem;border-radius:999px}
.btn[disabled]{opacity:1;background:var(--fill3);color:var(--label3);pointer-events:none}
.btn-plain[disabled]{background:none}
.btn .spinner{width:20px;height:20px}
.bottom-bar{padding:12px var(--m) calc(var(--sab) + 8px);background:linear-gradient(to bottom,transparent,var(--bg) 22%);position:relative;z-index:5;display:flex;flex-direction:column;gap:2px}
/* ===== Inset grouped lists ===== */
.group{margin:0 var(--m) 0}
.group + .group{margin-top:0}
.ghead{padding:22px calc(var(--m) + 16px) 7px;font-size:.765rem;line-height:1.385;color:var(--label2);text-transform:uppercase;letter-spacing:-.005em}
.gfoot{padding:7px calc(var(--m) + 16px) 0;font-size:.765rem;line-height:1.385;color:var(--label2)}
.list{background:var(--card);border-radius:var(--r-list);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;font-size:1rem;letter-spacing:-.024em;text-align:left;background:var(--card);transition:background .12s}
.row::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;transform:scaleY(.5);transform-origin:0 100%;background:var(--sep)}
.row.icon-row::after{left:60px}
.row:last-child::after{display:none}
button.row:active,.row.tap:active{background:var(--fill)}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:.882rem;color:var(--label2);margin-top:2px;line-height:1.333}
.row .val{color:var(--label2);text-align:right}
.row .chev{color:var(--label3);flex:none;margin-right:-4px}
.row .check{color:var(--tint);flex:none;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.row.sel .check{opacity:1;transform:none}
.row.destructive{color:var(--red)}
.ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:var(--onTint);background:var(--tint)}
.ico.gray{background:var(--gray)} .ico.apricot{background:var(--accent)} .ico.soft{background:var(--tintFill);color:var(--tint)}
.ico svg{width:19px;height:19px}
/* ===== Segmented control ===== */
.seg{position:relative;display:flex;background:var(--fill3);border-radius:9px;padding:2px;height:32px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;z-index:1;font-size:.765rem;font-weight:500;border-radius:7px;transition:background .2s;min-width:60px;letter-spacing:-.005em}
.seg button.on{font-weight:600;background:var(--cardElev);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){.seg button.on{background:#636366}}
.seg-wrap{margin:0 var(--m)}
/* ===== Toggle ===== */
.toggle{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s var(--push)}
.toggle.on{background:var(--tint)}
.toggle.on::after{transform:translateX(20px)}
/* ===== Numeric fields ===== */
.qhead{padding:8px var(--m) 4px}
.qhead p{margin-top:8px}
.numrow{display:flex;gap:10px;margin:0 var(--m)}
.numfield{flex:1;display:flex;align-items:baseline;gap:6px;background:var(--card);border-radius:var(--r-list);padding:14px 16px;min-height:72px;align-items:center;box-shadow:0 0 0 1.5px transparent inset;transition:box-shadow .15s}
.numfield:focus-within{box-shadow:0 0 0 2px var(--tint) inset}
.numfield.bad{box-shadow:0 0 0 2px var(--red) inset}
.numfield input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-family:var(--rounded);font-size:2.35rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--label);padding:0;caret-color:var(--tint)}
.numfield input::placeholder{color:var(--label3)}
.numfield .suffix{font-size:1.176rem;font-weight:600;color:var(--label2);flex:none}
.fmsg{margin:8px calc(var(--m) + 16px) 0;font-size:.765rem;line-height:1.385;min-height:18px;color:var(--label2)}
.fmsg.err{color:var(--red)}
.fmsg.warn{color:var(--orange)}
.inline-input{border:0;outline:0;background:transparent;text-align:right;font-size:1rem;width:64px;color:var(--label);padding:0;font-variant-numeric:tabular-nums;caret-color:var(--tint)}
.inline-input::placeholder{color:var(--label3)}
.inline-input.bad{color:var(--red)}
.pfield{display:flex;align-items:center;gap:4px;color:var(--label2);background:var(--fill3);border-radius:8px;padding:6px 8px;min-height:34px}
.pfield:focus-within{box-shadow:0 0 0 2px var(--tint) inset}
.pfield.bad{box-shadow:0 0 0 2px var(--red) inset}
.pfield .inline-input{width:46px}
.pfield.wide .inline-input{width:58px}
.dk{font-size:.882rem;color:var(--tint);padding:8px 4px;min-height:44px;flex:none}
/* ===== Wheel date picker (iOS style, month + year) ===== */
.wheel{position:relative;height:216px;display:flex;gap:0;background:var(--card);border-radius:var(--r-list);margin:0 var(--m);overflow:hidden;touch-action:pan-y}
.wheel .band{position:absolute;left:8px;right:8px;top:91px;height:34px;border-radius:8px;background:var(--fill3);pointer-events:none}
.wcol{position:relative;flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none;perspective:600px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 28%,#000 72%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol .pad{height:91px}
.witem{height:34px;line-height:34px;font-size:1.3rem;letter-spacing:-.02em;scroll-snap-align:center;color:var(--label);transform-origin:center;cursor:pointer;font-variant-numeric:tabular-nums;padding:0 18px;user-select:none}
.wcol.m .witem{text-align:right}
.wcol.y .witem{text-align:left}
.wcol:focus-visible{background:var(--fill3)}
.native-month{width:calc(100% - 32px);margin:0 var(--m);font-size:1.176rem;padding:14px 16px;border-radius:var(--r-list);border:0;background:var(--card);color:var(--label)}
/* ===== Sheets (grabber + detents), alerts, banners ===== */
.sheet-ov{position:absolute;inset:0;z-index:150;background:rgba(0,0,0,0);transition:background .35s}
.sheet-ov.show{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){.sheet-ov.show{background:rgba(0,0,0,.5)}}
.sheet{position:absolute;left:0;right:0;bottom:0;height:calc(100% - var(--sat) - 10px);background:var(--sheetBg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--push);box-shadow:0 0 30px rgba(0,0,0,.12);overflow:hidden}
.sheet.drag{transition:none}
.sheet .grabber{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--label3);z-index:3}
.sheet .grab-zone{position:absolute;top:0;left:0;right:0;height:22px;z-index:2;touch-action:none;cursor:grab}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;height:56px;padding:10px 8px 0;position:relative;flex:none;touch-action:none}
.sheet-nav .t{position:absolute;left:80px;right:80px;text-align:center;font-weight:600;font-size:1rem;letter-spacing:-.024em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .scroll{padding-bottom:calc(var(--sab) + 16px)}
.sheet .list,.sheet .row,.sheet .numfield,.sheet .wheel{background:var(--cardElev)}
.close-x{width:30px;height:30px;border-radius:50%;background:var(--fill3);color:var(--label2);display:grid;place-items:center;margin:0 8px}
.close-x:active{opacity:.5}
.alert-ov{position:absolute;inset:0;z-index:200;display:grid;place-items:center;background:rgba(0,0,0,0);transition:background .2s}
.alert-ov.show{background:rgba(0,0,0,.2)}
.alert{width:270px;border-radius:14px;background:var(--alert);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);text-align:center;overflow:hidden;transform:scale(1.15);opacity:0;transition:transform .3s var(--push),opacity .2s}
.alert-ov.show .alert{transform:none;opacity:1}
.alert .at{padding:19px 16px 0;font-weight:600;font-size:1rem;letter-spacing:-.024em}
.alert .am{padding:4px 16px 20px;font-size:.765rem;line-height:1.385}
.alert .ab{display:flex;border-top:.5px solid var(--sep)}
.alert .ab button{flex:1;min-height:44px;color:var(--tint);font-size:1rem;letter-spacing:-.024em;text-align:center}
.alert .ab button + button{border-left:.5px solid var(--sep)}
.alert .ab button.pref{font-weight:600}
.alert .ab button.destructive{color:var(--red)}
.alert .ab button:active{background:var(--fill)}
.banner{position:absolute;left:8px;right:8px;top:calc(var(--sat) - 6px);z-index:250;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:22px;background:var(--banner);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.14);transform:translateY(-140%);transition:transform .5s var(--push);pointer-events:auto}
.banner.show{transform:none}
.banner .ico{width:36px;height:36px;border-radius:9px}
.banner .bt{font-weight:600;font-size:.882rem;letter-spacing:-.014em}
.banner .bs{font-size:.882rem;color:var(--label2);letter-spacing:-.014em}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--label2);animation:spin .8s linear infinite;flex:none}
.btn-filled .spinner{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== Welcome ===== */
.app-icon{width:76px;height:76px;border-radius:17px;background:linear-gradient(160deg,#3C9483,#22604F);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.08) inset}
.feat{display:flex;gap:16px;align-items:flex-start;padding:12px 0}
.feat .fi{width:44px;flex:none;color:var(--tint);display:flex;justify-content:center;padding-top:2px}
.feat .fi svg{width:34px;height:34px}
/* ===== Loader ===== */
.pbar{height:4px;border-radius:2px;background:var(--fill3);overflow:hidden;margin:18px var(--m) 0}
.pbar span{display:block;height:100%;width:0;background:var(--tint);border-radius:2px}
.row .stat{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--label3)}
.row.done .stat{color:var(--tint)}
/* ===== Result ===== */
.hero{background:var(--card);border-radius:var(--r-list);margin:0 var(--m);padding:18px 16px 16px}
.hero .num{font-family:var(--rounded);font-weight:700;font-size:4.2rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--tint);margin-top:6px}
.hero .num small{font-size:1.4rem;font-weight:600;color:var(--label2);margin-left:4px;letter-spacing:0}
.rbar{position:relative;height:8px;border-radius:4px;background:var(--fill3);margin:18px 0 8px}
.rbar .band{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--tint);opacity:.35}
.rbar .mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 3px var(--card)}
.rlabels{display:flex;justify-content:space-between;font-size:.765rem;color:var(--label2);font-variant-numeric:tabular-nums}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:120}
.story{width:198px;height:352px;border-radius:22px;margin:4px auto 0;position:relative;overflow:hidden;color:#fff;padding:18px 16px;display:flex;flex-direction:column;background:linear-gradient(165deg,#3C9483,#163F37);box-shadow:0 12px 30px rgba(0,0,0,.2)}
.story .sn{font-family:var(--rounded);font-weight:700;font-size:3.6rem;line-height:1;margin-top:auto;letter-spacing:-.02em}
.story .sn span{font-size:1.1rem;opacity:.8;margin-left:3px}
.story .sbar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin:12px 0 0;position:relative}
.story .sbar i{position:absolute;top:0;bottom:0;left:28%;right:28%;border-radius:3px;background:#F7C08A}
/* ===== Paywall (StoreKit-style subscription sheet) ===== */
.paywall{background:#0E1513}
.bubbles{position:absolute;left:0;right:0;top:0;height:46%;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px;overflow:hidden;opacity:.85;-webkit-mask-image:linear-gradient(to bottom,transparent 84px,#000 120px,#000 60%,transparent);mask-image:linear-gradient(to bottom,transparent 84px,#000 120px,#000 60%,transparent)}
.bcol{display:flex;flex-direction:column;gap:8px;animation:scrollUp 48s linear infinite}
.bcol.b2{animation-duration:60s}
@keyframes scrollUp{to{transform:translateY(-50%)}}
.bub{max-width:95%;padding:8px 12px;border-radius:18px;font-size:.8rem;line-height:1.3}
.bub.me{align-self:flex-end;background:#2F7D6D;color:#fff;border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:#2C2C2E;color:#EBEBF5;border-bottom-left-radius:5px}
.bub .who{display:block;font-size:.65rem;opacity:.6;margin-top:3px}
.pw-top{position:absolute;top:calc(var(--sat) + 4px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px 0 16px;z-index:6}
.pill-tag{font-size:.706rem;font-weight:600;color:#EBEBF5;background:rgba(118,118,128,.4);padding:5px 10px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pw-close{width:44px;height:44px;display:grid;place-items:center}
.pw-close span{width:30px;height:30px;border-radius:50%;background:rgba(118,118,128,.45);display:grid;place-items:center;color:#EBEBF5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pw-close:active span{opacity:.5}
.pw-sheet{position:absolute;left:0;right:0;bottom:0;height:80%;background:var(--sheetBg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;z-index:5;animation:modalIn .6s .1s var(--push) both}
.pw-sheet .scroll{padding:22px 0 8px}
.pw-icon{flex:none;width:52px;height:52px;border-radius:12px;margin:0 auto 12px;background:linear-gradient(160deg,#3C9483,#22604F);display:grid;place-items:center}
.plan-opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;background:var(--card);border-radius:var(--r-list);box-shadow:0 0 0 1px var(--sep) inset;text-align:left;transition:box-shadow .15s}
.plan-opt + .plan-opt{margin-top:10px}
.plan-opt.sel{box-shadow:0 0 0 2px var(--tint) inset}
.plan-opt .radio{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1.5px var(--label3) inset;flex:none;display:grid;place-items:center;color:var(--onTint)}
.plan-opt.sel .radio{background:var(--tint);box-shadow:none}
.plan-opt .radio svg{opacity:0}
.plan-opt.sel .radio svg{opacity:1}
.plan-opt .price{font-weight:600;font-size:1.06rem;letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.706rem;font-weight:600;color:var(--accentText);background:rgba(242,166,90,.2);padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
.pw-foot{padding:10px var(--m) calc(var(--sab) + 2px);background:var(--sheetBg);box-shadow:0 -.5px 0 var(--sep)}
.links{display:flex;justify-content:center;flex-wrap:wrap;font-size:.765rem}
.links button{color:var(--tint);padding:8px 6px;min-height:34px}
/* ===== Home ===== */
.tabc{position:absolute;inset:0}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(49px + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:2px;font-size:.6rem;font-weight:500;color:var(--gray);letter-spacing:.01em}
.tab.on{color:var(--tint)}
.tab svg{width:26px;height:26px}
.tab .f{display:none}.tab.on .f{display:block}.tab.on .o{display:none}
.streak-card{display:flex;align-items:center;gap:14px;padding:14px 16px}
.wdots{display:flex;gap:6px;margin-left:auto}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.6rem;font-weight:600;color:var(--label2)}
.wd i{width:20px;height:20px;border-radius:50%;background:var(--fill3);display:grid;place-items:center;font-style:normal;color:#fff}
.wd i.done{background:var(--accent)}
.wd i.today{box-shadow:0 0 0 1.5px var(--label2)}
.hcheck{width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;color:var(--label3);flex:none}
.row.done .hcheck{color:var(--tint)}
.row.done .htitle{color:var(--label2)}
.disc{transition:transform .25s var(--push);color:var(--label3)}
.row.open .disc{transform:rotate(90deg)}
.more{display:none;padding:0 16px 12px 60px;font-size:.882rem;color:var(--label2);background:var(--card);position:relative}
.more.open{display:block}
.more ul{margin:0;padding-left:16px;line-height:1.6}
.chart text{font-size:10px;fill:var(--label2);font-family:var(--font)}
#restart{position:fixed;left:16px;bottom:14px;z-index:400;font:500 12px/1 var(--font);color:var(--label2);background:var(--card);padding:8px 11px;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* Continuous (squircle) corners where the browser supports corner-shape */
@supports (corner-shape:squircle){
  .list,.numfield,.wheel,.hero,.plan-opt,.btn:not(.btn-small),.alert,.ico,.app-icon,.pw-icon,.banner{corner-shape:superellipse(1.6)}
}
/* ===== Mobile: full screen ===== */
@media (max-width:500px){
  body{display:block;background:var(--bg)}
  .stage{display:block;width:100%;height:100%}
  .stage-label{display:none}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;transform:none!important;margin:0!important}
  .screen-wrap{border-radius:0}
  .island,.statusbar,.home-ind{display:none}
  :root{--sat:env(safe-area-inset-top,20px);--sab:env(safe-area-inset-bottom,12px)}
  #restart{left:50%;right:auto;transform:translateX(-50%);bottom:auto;top:calc(env(safe-area-inset-top) + 4px);padding:4px 8px;font-size:10.5px;opacity:.55}
}
/* ===== Reduce Motion ===== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .bcol{animation:none!important}
  .push-in,.pop-in,.modal-in{animation:fadeIn .2s both!important}
}

      <div class="ghead">Reminders</div><div class="group"><div class="list">${[['bed', I.moon, 'Bedtime wind-down'], ['morning', I.sunSm, 'Morning plan'], ['checkin', I.ruler.replace('width="24" height="24"', 'width="19" height="19"'), 'Measurement check-in']].map(([k, ic, l]) => `<button class="row icon-row" data-act="rem" data-v="${k}" role="switch" aria-checked="${S.reminders[k]}"><span class="ico">${ic}</span><span class="grow">${l}</span><span class="toggle ${S.reminders[k] ? 'on' : ''}"></span></button>`).join('')}</div></div>
      <div class="ghead">Settings</div><div class="group"><div class="list">
        <button class="row icon-row" data-act="unitToggle"><span class="ico gray">${I.ruler.replace('width="24" height="24"', 'width="19" height="19"')}</span><span class="grow">Units</span><span class="val">${S.unit === 'cm' ? 'Metric' : 'US'}</span><span class="chev">${I.chev}</span></button>
        <button class="row icon-row" data-act="methodSheet"><span class="ico gray">${I.function.replace('width="24" height="24"', 'width="19" height="19"')}</span><span class="grow">Methods & Sources</span><span class="chev">${I.chev}</span></button>
        <button class="row icon-row" data-act="legal" data-v="Medical Disclaimer"><span class="ico gray">${I.heart}</span><span class="grow">Medical Disclaimer</span><span class="chev">${I.chev}</span></button></div></div>
      <div class="group" style="margin-top:22px"><div class="list"><button class="row destructive" data-act="deleteAll" style="justify-content:center">Delete All Data</button></div></div>
      <p class="gfoot" style="text-align:center">All data stays on this device · Prototype v0.2</p>`); }
};
const TABMOUNT = {
  growth: c => {
    const P = predict(), ms = allMeasurements(), male = S.sex !== 'female';
    const W = 330, H = 220, L = 38, R = 12, T = 16, B = 24, cur = ms[ms.length - 1];
    const a0 = Math.max(2, Math.floor(Math.min(...ms.map(m => m.age))) - 1), a1 = 19, endAge = Math.max(cur.age + .5, male ? 18 : 16.5);
    const y0 = Math.floor((Math.min(...ms.map(m => m.cm)) - 8) / 10) * 10, y1 = Math.ceil((P.high + 6) / 10) * 10;
    const X = a => L + (a - a0) / (a1 - a0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
    const proj = tg => { const pts = [], sp = endAge - cur.age; for (let i = 0; i <= 24; i++) { const u = i / 24; pts.push([X(cur.age + sp * u), Y(cur.cm + (tg - cur.cm) * (1 - Math.pow(1 - u, 2.2)))]); } if (endAge < a1) pts.push([X(a1), Y(tg)]); return pts; };
    const line = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const ph = proj(P.high), pl = proj(P.low), band = line(ph) + ' ' + pl.slice().reverse().map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + 'Z';
    let g = ''; for (let v = y0; v <= y1; v += 10) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--sep)" stroke-width=".5"/><text x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${S.unit === 'cm' ? v : fmtFt(v).replace(' ', '')}</text>`;
    for (let a = Math.ceil(a0 / 2) * 2; a <= a1; a += 2) g += `<text x="${X(a)}" y="${H - 6}" text-anchor="middle">${a}</text>`;
    $('#chart', c).innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Height by age: ${ms.length} measurement(s); projected adult height ${Math.round(P.value)} cm, likely ${Math.round(P.low)} to ${Math.round(P.high)}">${g}
      <path d="${band}" style="fill:var(--tintFill)"/><path d="${line(proj(P.value))}" fill="none" style="stroke:var(--tint)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
      <text x="${W - R - 2}" y="${Y(P.high) - 6}" text-anchor="end" style="fill:var(--tint);font-weight:600;font-size:11px">${fmtH(P.value)}</text>
      ${ms.length > 1 ? `<path d="${line(ms.map(m => [X(m.age), Y(m.cm)]))}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${ms.map(m => `<circle cx="${X(m.age).toFixed(1)}" cy="${Y(m.cm).toFixed(1)}" r="4.5" style="fill:var(--card);stroke:var(--accent)" stroke-width="2.5"/>`).join('')}</svg>`;
  }
};
function logMeasurement() {
  const opts = [['Today', 0], ['3 mo ago', .25], ['6 mo ago', .5], ['1 yr ago', 1]]; let off = 0;
  const unit = S.unit === 'cm' ? 'cm' : 'ft';
  openSheet({ title: 'Log Measurement', left: `<button class="nav-btn" data-close>Cancel</button>`, right: `<button class="nav-btn bold" id="contBtn" disabled>Add</button>`,
    body: `<div class="ghead" style="padding-top:8px">Date</div><div class="seg-wrap"><div class="seg" id="lmWhen" role="radiogroup" aria-label="Measurement date">${opts.map(([l, o], i) => `<button role="radio" aria-checked="${i === 0}" class="${i === 0 ? 'on' : ''}" data-o="${o}">${l}</button>`).join('')}</div></div>
      <div class="ghead">Height</div>${numBlock('lm', unit, unit === 'cm' ? 'e.g. 152' : ['5', '0'], 'Height')}<div class="fmsg" id="fmsg" aria-live="polite"></div>
      <p class="gfoot">Morning, no shoes, heels and back against the wall.</p>`,
    onMount: (ov, api) => {
      const check = () => { const r = readMeasure(ov, 'lm', unit); if (r.empty) return { ok: false };
        if (isNaN(r.value) || r.value < RANGE.height[0] || r.value > RANGE.height[1]) return { ok: false, msg: r.msg || rangeMsg('height', unit), cls: 'err', hard: r.value > 260 };
        const prev = allMeasurements(); const last = prev[prev.length - 1];
        if (off === 0 && last && r.value < last.cm - 2) return { ok: true, msg: 'That is lower than the last entry. Please double-check.', cls: 'warn' };
        return { ok: true, msg: unit === 'cm' ? `= ${fmtFt(r.value)}` : `= ${Math.round(r.value)} cm`, cls: '' }; };
      const save = () => { const r = readMeasure(ov, 'lm', unit); if (!(r.value >= RANGE.height[0] && r.value <= RANGE.height[1])) return; haptic(10);
        const before = predict().value; if (!S.heightCm0) S.heightCm0 = S.heightCm;
        S.measurements.push({ cm: r.value, age: ageYears() - off, label: off === 0 ? 'Today' : opts.find(o => o[1] === off)[0], ts: Date.now() });
        if (off === 0) S.heightCm = r.value;
        api.close(); renderTab(); const d = predict().value - before;
        setTimeout(() => banner('Measurement added', off === 0 ? (Math.abs(d) < .5 ? 'Prediction unchanged' : `Prediction updated ${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(1)} cm`) : 'Saved to your history', I.ruler.replace('width="24" height="24"', 'width="20" height="20"')), 350); };
      const run = bindForm(ov, check, save);
      $('#contBtn', ov).addEventListener('click', () => { if (run(true)) save(); });
      $('#lmWhen', ov).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; haptic(); off = +b.dataset.o; $$('#lmWhen button', ov).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); }); run(false); });
    } });
}
/* ---------- actions ---------- */
function nextStep() {
  if (S.editing) { S.editing = false; return go('loader', 'push'); }
  if (S.step < STEPS.length - 1) { S.step++; go('onb', 'push'); } else go('loader', 'push');
}
function refresh() {
  const def = SCREENS.onb(); current.innerHTML = def.html;
  const p = $('.progress span', current); if (p) { p.style.transition = 'none'; p.style.width = p.dataset.to; }
  wireNav(current); def.mount && def.mount(current);
}
function closeSheets() { $$('.sheet-ov', $('#wrap')).forEach(o => { o.classList.remove('show'); const s = $('.sheet', o); s.style.transform = 'translateY(100%)'; setTimeout(() => o.remove(), 450); }); }
const ACTIONS = {
  start: () => { S.step = 0; go('onb', 'push'); },
  back: () => { if (S.step > 0) { S.step--; go('onb', 'pop'); } else go('welcome', 'pop'); },
  cancelEdit: () => { S.editing = false; go('result', 'pop'); },
  next: () => nextStep(),
  pick: el => { const k = el.dataset.key, v = el.dataset.v;
    if (k === 'sex' && S.sex && S.sex !== v) S.signs = [];
    S[k] = v; $$(`.row[data-key="${k}"]`, current).forEach(b => { b.classList.toggle('sel', b === el); b.setAttribute('aria-checked', b === el); });
    const scr = current; scr.style.pointerEvents = 'none';
    setTimeout(() => { scr.style.pointerEvents = ''; if (current === scr) nextStep(); }, reduceMotion() ? 150 : 350); },
  dobMode: () => { S.dobNative = !S.dobNative; refresh(); },
  unit: el => { if (S.unit === el.dataset.v) return; S.unit = el.dataset.v; refresh(); },
  wunit: el => { if (S.wunit === el.dataset.v) return; S.wunit = el.dataset.v; refresh(); },
  skipWeight: () => { S.weightSkipped = true; S.weightKg = null; nextStep(); },
  dk: el => { const k = el.dataset.v;
    if (S.unknownParent === k) { S.unknownParent = null; return refresh(); }
    if (S.unknownParent) return alertBox("We need one parent's height", 'The estimate relies on family height. Please enter at least one parent, even a best guess.');
    S.unknownParent = k; S[k + 'Cm'] = null; refresh(); },
  sign: el => { const v = el.dataset.v; let s = S.signs;
    if (v === 'none' || v === 'unsure') s = s.includes(v) ? [] : [v];
    else { s = s.filter(x => x !== 'none' && x !== 'unsure'); s = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; }
    S.signs = s; $$('.row[data-act="sign"]', current).forEach(b => { b.classList.toggle('sel', s.includes(b.dataset.v)); b.setAttribute('aria-checked', s.includes(b.dataset.v)); });
    $('#contBtn', current).disabled = !s.length; },
  methodSheet: () => methodSheet(),
  shareCard: () => shareCard(),
  shareDo: el => { closeSheets(); setTimeout(() => banner(el.dataset.v, 'Prototype: no file was created', I.share.replace('width="22" height="22"', 'width="20" height="20"')), 300); },
  edit: el => { S.editing = true; S.step = +el.dataset.v; go('onb', 'push'); },
  paywall: el => { S.paywallFrom = el.dataset.from; go('paywall', 'modal'); },
  closePaywall: () => go(S.paid ? 'home' : 'result', 'dismiss'),
  plan: el => { S.plan = el.dataset.v; $$('.plan-opt', current).forEach(b => { b.classList.toggle('sel', b === el); b.setAttribute('aria-checked', b === el); });
    $('#trialRow', current).style.display = S.plan === 'annual' ? '' : 'none'; $('#buyBtn', current).textContent = buyLabel(); $('#renew', current).textContent = renewText(); },
  trial: el => { S.trial = !S.trial; $('.toggle', el).classList.toggle('on', S.trial); el.setAttribute('aria-checked', S.trial); $('#buyBtn', current).textContent = buyLabel(); $('#renew', current).textContent = renewText(); },
  buy: () => purchaseSheet(),
  restore: () => alertBox('Restore Purchases', S.paid ? 'Your KinHeight Pro subscription is active.' : 'No previous purchases were found for this Apple ID. (Prototype)'),
  legal: el => openSheet({ title: esc(el.dataset.v), right: `<button class="nav-btn bold" data-close>Done</button>`, detent: 'medium', body: `<div class="group"><div class="list"><div class="row" style="display:block"><p class="body">Placeholder ${esc(el.dataset.v)} for the prototype.</p><p class="subhead l2" style="margin-top:8px">KinHeight gives estimates, not medical diagnoses. Predictions use published formulas with known error ranges. Always talk to a pediatrician about growth concerns.</p></div></div></div>` }),
  askParent: () => alertBox('Ask a Parent', 'In the app this sends a link so a parent can approve the purchase (Ask to Buy / Family Link). Prototype only.'),
  bed: el => { S.bedtime = el.dataset.v; $$('.row[data-act="bed"]', current).forEach(b => { b.classList.toggle('sel', b === el); b.setAttribute('aria-checked', b === el); }); $('#contBtn', current).disabled = false; },
  remToggle: el => { S.reminders.bed = !S.reminders.bed; $('.toggle', el).classList.toggle('on', S.reminders.bed); el.setAttribute('aria-checked', S.reminders.bed); },
  startPlan: () => { const done = () => { S.tab = 'today'; go('home', 'fade'); };
    if (!S.reminders.bed) return done();
    alertBox('“KinHeight” Would Like to Send You Notifications', 'Bedtime wind-down and your morning plan, at most 2 a day. You can change this in Settings. (Simulated system prompt)',
      [{ t: "Don't Allow", fn: () => { S.reminders.bed = false; S.reminders.morning = false; done(); } }, { t: 'Allow', pref: true, fn: () => { done(); setTimeout(() => banner('Bedtime reminder set', `Wind-down nudge 30 minutes before ${S.bedtime}`, I.moon), 600); } }]); },
  tab: el => { if (S.tab === el.dataset.v) { const sc = $('#tabc .scroll', current); sc && sc.scrollTo({ top: 0, behavior: 'smooth' }); return; } S.tab = el.dataset.v; renderTab(); },
  habit: el => { const k = el.dataset.v; S.habits[k] = !S.habits[k]; el.classList.toggle('done', S.habits[k]); el.setAttribute('aria-checked', S.habits[k]); $('.hcheck', el).innerHTML = S.habits[k] ? I.circleCheck : I.circle; haptic(S.habits[k] ? 10 : 4);
    const n = doneCount(); $('#doneN', current).textContent = `${n} of 5 done`;
    if (n >= 3 && !S.streakBumped) { S.streakBumped = true; S.streak++; $('#streakN', current).textContent = S.streak; $('#wdots', current).innerHTML = streakDots();
      banner(`${S.streak}-day streak!`, 'Nice work. Keep it going tomorrow.', I.flame, 'apricot'); confetti(); }
    else if (n === 5 && S.habits[k]) banner('All 5 habits done', 'A great day for growing.', I.check); },
  logM: () => logMeasurement(),
  day: el => { const i = +el.dataset.v; S.openDay = S.openDay === i ? -1 : i;
    $$('.row[data-act="day"]', current).forEach((d, j) => { d.classList.toggle('open', S.openDay === j); d.setAttribute('aria-expanded', S.openDay === j); d.nextElementSibling.classList.toggle('open', S.openDay === j); }); },
  rem: el => { const k = el.dataset.v; S.reminders[k] = !S.reminders[k]; $('.toggle', el).classList.toggle('on', S.reminders[k]); el.setAttribute('aria-checked', S.reminders[k]); },
  unitToggle: () => { S.unit = S.unit === 'cm' ? 'ft' : 'cm'; S.wunit = S.unit === 'cm' ? 'kg' : 'lb'; renderTab(); },
  addChild: () => alertBox(teen() ? 'Invite a Parent' : 'Add Child', teen() ? 'Shares an invite link so a parent can follow your plan. (Prototype)' : 'Opens the same short setup for another child. Annual includes unlimited children. (Prototype)'),
  alert: el => { const [a, b] = el.dataset.v.split('|'); alertBox(a, b); },
  deleteAll: () => alertBox('Delete All Data?', 'This removes every measurement and setting from this device. This can’t be undone.', [{ t: 'Cancel' }, { t: 'Delete', destructive: true, fn: restart }])
};
function dispatch(e) { if (e.__kh) return; e.__kh = true; const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; haptic(); const fn = ACTIONS[a.dataset.act]; if (fn) fn(a, e); }
host.addEventListener('click', dispatch);
$('#wrap').addEventListener('click', dispatch);

function restart() { S = DEFAULTS(); $$('.sheet-ov,.alert-ov,.banner', $('#wrap')).forEach(n => n.remove()); go('welcome', 'fade'); }
$('#restart').addEventListener('click', e => { e.preventDefault(); restart(); });

function fit() { const d = $('#device'); if (innerWidth <= 500) { d.style.transform = ''; d.style.margin = ''; return; }
  const s = Math.min(1, (innerHeight - 70) / 866, (innerWidth - 40) / 412);
  d.style.transform = s < 1 ? `scale(${s})` : ''; d.style.margin = s < 1 ? `${-(866 * (1 - s)) / 2}px ${-(412 * (1 - s)) / 2}px` : ''; }
addEventListener('resize', fit); fit();
window.__KH = { state: () => S, go, predict };
go('welcome', 'fade');
</script>
